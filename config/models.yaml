# 단계별 LLM 지정 — pipeline/llm.py 만 이 파일을 읽는다.
# 모델 교체는 여기서만 한다. 사용 가능 여부 확인: python -m pipeline.llm check
#
# provider: gemini (GEMINI_API_KEY) | anthropic (ANTHROPIC_API_KEY)
#           | claude_cli  (같은 머신의 Claude Code CLI `claude -p` — Pro 로그인, 키 불필요)
#           | claude_code (API 호출 없음 — 검수 요청 파일을 Claude Code 세션이 처리, 02c_external_review.py)
# search: true 면 Gemini Google 검색 연동(grounding) 사용
# temperature·top_p·top_k·thinking_budget 은 쓰지 않는다 (Gemini 공지: 다음 모델부터 400 오류)
# thinking: minimal|low|medium|high — Gemini 생각 양 (생략 시 모델 기본값). 생각 토큰은 출력 단가로 청구된다
# 호출마다 토큰 수가 로그에 남는다 (input/output/thinking)
# 원칙: 작성(Claude)과 검수(Gemini)는 다른 회사 모델 (기획서 6-0)
#
# 역할 (2026-10-06 변경): Gemini 는 찾기·검수, Claude 는 읽고 쓰기.
#   Gemini 가 쓰기까지 하면 출처 페이지에 없는 내용을 사실로 적는 문제가 반복돼 작성을 Claude 로 옮겼다.

stages:
  topics:          # 01 주간 주제 조사
    provider: gemini
    model: gemini-3.8-flash   # 2026-10-06 Pro 와 같은 프롬프트로 비교 — 품질 차이 없음(오히려 구체적), Flash 로
    search: true

  trends:          # 01 관광지 트렌드 스캔 (주 1회, 외국인 사이 지금 뜨는 곳·행사 — pipeline/trends.py)
    provider: gemini
    model: gemini-3.8-flash
    search: true

  sources:         # 02 출처 찾기 — 읽을 페이지 후보만 고른다 (사실은 쓰지 않음)
    provider: gemini
    model: gemini-3.8-flash   # 2026-10-06 Pro → Flash: 후보 고르기만 하므로 충분, 비용 절감
    search: true

  write:           # 02 작성 — 받아 둔 페이지 본문만 보고 사실·대본·블로그 (도구 없음)
    provider: claude_cli
    # model: sonnet          # 생략하면 Claude Code 기본 모델
    tools: []
    timeout_sec: 1500

  write_search:    # 02 작성 — 쓸 만한 페이지가 부족할 때만 Claude 가 직접 추가 검색
    provider: claude_cli
    tools: [WebSearch, WebFetch]
    timeout_sec: 1500

  pick_visuals:    # 04 영상 화면 고르기 — 대본 줄마다 후보 클립 썸네일 묶음을 보고 고른다 (구독 Claude, API 비용 없음)
    provider: claude_cli
    tools: [Read]
    timeout_sec: 600

  social:          # X·Threads 소개 글 (사실 목록만 사용, pipeline/social.py) — 쓰기는 Claude (역할 분담), 검사는 코드 규칙
    provider: claude_cli
    tools: []
    timeout_sec: 600

  tts:             # 04 영상 음성 — Gemini TTS (GEMINI_API_KEY 그대로). 목소리·속도는 config/voice.yaml
    provider: gemini
    model: gemini-3.8-flash-tts
    audio: true
    timeout_sec: 60  # 한 줄은 보통 5~10초 — 실제 운영에서 응답 없이 멈춘 호출이 있어 짧게 끊고 재시도

  # 검수 단계는 작성 모델(Claude)과 다른 회사 모델이 맡는다.
  reddit_find:     # Reddit 답변 후보 찾기 (pipeline/reddit.py) — 찾기는 Gemini
    provider: gemini
    model: gemini-3.8-flash
    search: true
    thinking: low

  dataset_regions: # 지역 영문명 채우기 (pipeline/dataset.py, 새 지역이 생겼을 때만)
    provider: claude_cli
    tools: []
    timeout_sec: 300

  data_note_write: # 공공 데이터 글 설명 (숫자는 코드가 계산, pipeline/data_notes.py)
    provider: claude_cli
    tools: []
    timeout_sec: 300

  data_note_review: # 공공 데이터 글 검수 (쓴 회사와 다른 모델) + 한국어 번역
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: low

  reddit_rules:    # 처음 보는 커뮤니티의 규칙 찾기 (검색 근거가 있을 때만 사용)
    provider: gemini
    model: gemini-3.8-flash
    search: true
    thinking: low

  reddit_rules_extract:  # 규칙 검색 보고를 JSON 으로 (검색 안 함)
    provider: gemini
    model: gemini-3.8-flash
    thinking: low

  reddit_answer:   # Reddit 답변 초안 — 게시된 글의 사실 목록만, 쓰기는 Claude
    provider: claude_cli
    tools: []
    timeout_sec: 300

  reddit_direct:   # 운영자 방향 → 커뮤니티 말투 영어 댓글 (시술 추천은 거절)
    provider: claude_cli
    tools: []
    timeout_sec: 300

  reddit_brief:    # 질문 정리·우리 글 근거·작성 권고 — 운영자에게만 보내는 한국어 브리핑 (게시 안 함, 2026-11-03)
    provider: claude_cli
    tools: []
    timeout_sec: 300

  reddit_facts:    # 직접 작성용 사실 고르기 (AI 글 금지 커뮤니티) — 고르기만, 사실 문장은 코드가 목록에서 원문 그대로
    provider: claude_cli
    tools: []
    timeout_sec: 300

  reddit_light_check:  # 운영자가 직접 쓴 Reddit 글 가벼운 검사 (2026-11-02) — 일반 의학 지식으로 틀린 의료 내용·법적 문제 문장만 골라 빼게 함, 관련 글 고르기·번역
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: low

  reddit_research: # Reddit 질문 조사 — 읽을 출처 페이지 후보만 고른다 (찾기는 Gemini, 2026-11-05)
    provider: gemini
    model: gemini-3.8-flash
    search: true

  reddit_research_read:  # 받아 둔 출처 페이지에서 질문에 맞는 사실·원문 인용 뽑기 (읽기는 Claude, 코드가 인용 대조)
    provider: claude_cli
    tools: []
    timeout_sec: 600

  reddit_review:   # Reddit 답변 검수 (쓴 회사와 다른 모델) — 사실 대조·과장·광고·한국어 번역
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: low

  pick_opener:     # SNS 첫 줄 고르기 (2026-10-20, pipeline/social.pick_openers) — Claude 가 쓴 후보 5개 중 하나, 쓴 회사와 다른 모델
    provider: gemini
    model: gemini-3.8-flash
    thinking: low

  shorts_review:   # 숏폼 대본 검수 (쓴 회사와 다른 모델) — 사실 대조·과장·위험 안내 줄 + 한국어 번역
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: low

  reels_screen:    # 리믹스 번역 릴스 — 프레임을 보고 화면 글자·장면 신호(주사·전후·병원) 읽기 (pipeline/reels_work.py)
    provider: claude_cli
    tools: [Read]
    timeout_sec: 600

  reels_translate: # 리믹스 번역 릴스 — 받아쓰기·화면 글자 → 원문 그대로의 영어 자막 (쓰기 = Claude)
    provider: claude_cli
    tools: []
    timeout_sec: 600

  reels_review:    # 리믹스 번역 릴스 — 원문 대조·원문 과장 검수 (쓴 회사와 다른 모델)
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: low

  translate:       # 03 검수용 한국어 번역 (텔레그램 검수 메시지·첨부 — 게시되지 않는 참고용, pipeline/translate.py)
    provider: gemini
    model: gemini-3.8-flash
    thinking: low

  shorts_write:    # 숏폼 대본 — 블로그 글을 한 영상 = 한 질문으로 (pipeline/shorts.py, 사실 목록만)
    provider: claude_cli
    tools: []
    timeout_sec: 900

  figure_plan:     # 블로그 설명 그림 — 승인된 본문에서 그림이 필요한 섹션·도식 (pipeline/figures.py)
    provider: claude_cli
    tools: []
    timeout_sec: 600

  telegram_chat:   # 텔레그램의 자유로운 말 해석·원인 찾기 (pipeline/telegram_router.py). 도구 없음 — 코드가 지운 기록을 프롬프트로 받는다, 명령은 제안만
    provider: claude_cli
    tools: []  # Read 는 차단 규칙을 줘도 .env 까지 읽혔다 (2026-11-01 시험). 도구를 주지 않는다
    timeout_sec: 300

  figure_check:    # 완성된 블로그 그림을 눈으로 검사 (글자 겹침·그림과 설명 불일치·사실 목록 대조). 그림은 Claude 로만 (사람 결정 2026-11-01), 최종은 사람 승인
    provider: claude_cli
    tools: [Read]
    timeout_sec: 300

  explainer_plan:  # 숏폼 실험 E·BE — 대본 줄마다 설명 도식 종류·글자 (pipeline/explainer.py, 글자는 사실 목록만 → 코드 검사)
    provider: claude_cli
    tools: []
    timeout_sec: 600

  scene_prompts:   # 숏폼 화면 소스 실험 B·C — 검증된 대본으로 AI 영상 장면 프롬프트 (pipeline/experiment.py)
    provider: claude_cli
    tools: []
    timeout_sec: 600

  citation_check:  # AI 인용 점검 — 독자 질문에 우리 사이트가 출처로 잡히는지 (pipeline/citation_check.py, 4주마다)
    provider: gemini
    model: gemini-3.8-flash
    search: true

  source_check:    # 02b ② 출처 본문 대조
    provider: gemini
    model: gemini-3.8-flash

  cross_review:    # 02b ③ 교차 모델 검수
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: low    # 생각 토큰 = 출력 단가. 기본(high)이 비용 대부분이라 낮춤 (2026-10-06, 하루 출력 442K)

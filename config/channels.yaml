# 채널별 포맷·빈도 (기획서 2장). 01_topics / 02_draft 프롬프트에 그대로 들어간다.

audience:
  language: en            # 영어권 우선
  regions: [US, CA, TH, SG]

shortform:
  # 형식 (2026-10-07): video = TTS + 실제 영상 클립(Claude 가 고름) | carousel = 사진 넘기기형(글자 슬라이드 — 시험해 보니 약해서 보류)
  # 주력은 블로그. 숏폼은 작게 시험: 주 video_per_week 편(그 주 승인 글 중 수요 점수 순), 4주 뒤 조회수·블로그 유입으로 계속할지 판단.
  # 같은 틀의 영상을 많이 올리면 유튜브 "대량 생산·반복 콘텐츠"(2026-07)·스팸 판정에 가까워진다 — 편수를 늘리기 전에 다시 검토.
  format: video
  video_per_week: 2
  carousel_channels: [instagram, tiktok]   # 사진 넘기기형일 때만 (유튜브 쇼츠는 올릴 수 없다)
  duration_sec: [30, 60]
  hook_sec: 3             # 첫 2~3초 질문형 훅
  channels:
    # 영상 1편을 세 채널에 각각 올리므로 빈도는 같다 (2026-10-06) — 2026-10-07 시험 기간 주 2편 (video_per_week)
    tiktok:    {per_week: 2, aspect: "9:16", notes: "빠른 컷, 트렌드 사운드 금지(라이선스)"}
    instagram: {per_week: 2, aspect: "9:16", notes: "방한 전 탐색층, 저장 유도"}
    youtube:   {per_week: 2, aspect: "9:16", notes: "검색 키워드를 제목 앞쪽에"}

blog:
  per_week: 5             # 초안 1편 = 대본 + 블로그, 승인된 블로그는 모두 게시된다
  words: [1200, 2000]

content_axes:             # 기획서 3장
  - procedure            # 시술 설명
  - price_guide          # 가격 가이드 (특정 병원 가격표 X)
  - how_to               # 이용 가이드
  - trend                # 트렌드
  - review_curation      # 후기 큐레이션 (병원별 X)
  - procedure_travel     # 시술 × 여행 (정보만) — 관광지 정보는 이 축 안에서만 (config/attractions.yaml, 트렌드)
  - skincare             # 재생·진정 화장품·홈케어 (화장품법 §13: 의약품 오인 표현 금지, 협찬이면 스폰서 트랙)
# travel_guide(관광지만 다루는 글)는 2026-10-06 제외: 숏폼은 초기 영상으로 계정 주제가 분류되므로
# 시술 정보를 볼 사람을 모으려면 시술 계열에 집중한다. 이 목록에 없는 축의 주제는 후보에서 빠진다.

# X·Threads 텍스트 소개 글 (pipeline/social.py) — 블로그 글 1편당 1개씩 (주 5편 = 각 채널 월 약 22개)
text_social:
  x:
    mode: intent       # intent = 텔레그램의 작성 링크를 눌러 사람이 [게시] (무료) | api = X API (유료: 건당 약 $0.015, 링크 포함 약 $0.20)
    max_chars: 280
  threads:
    mode: api          # api = Threads API (무료, THREADS_ACCESS_TOKEN — 없으면 작성 링크) | intent
    max_chars: 500

topics_per_week: 6        # 주 5편 게시 + 예비 1
# 주제 후보 유형별 개수 (합 = topics_per_week). 유형 안에서는 수요 점수 순, 모자라면 다른 유형으로 채운다.
topic_quota:
  info:                   # 시술 정보
    axes: [procedure, price_guide, how_to, trend, review_curation, skincare]
    count: 4
  procedure_travel:       # 시술 × 여행 (시술 일정·회복과 엮은 여행 정보)
    axes: [procedure_travel]
    count: 2

# 스폰서(병원 광고) 콘텐츠를 올릴 수 있는 채널 — 플랫폼 정책 (2026-09 확인, 기획서 12-1-1)
# 06_publish 는 allowed: false 채널에 스폰서 콘텐츠를 올리지 않고, requires 설정을 켠 채로만 게시한다.
sponsored_policy:
  tiktok:
    allowed: false
    why: "TikTok Branded Content Policy — 미용 클리닉·미용 시술 홍보 금지 (2026-03 완화는 미국·캐나다 병원의 유료 광고만 해당)"
  instagram:
    allowed: true
    requires: ["브랜디드 콘텐츠 도구(유료 파트너십 라벨)로 병원 태그", "18세 이상 연령 제한"]
  youtube:
    allowed: true
    requires: ["'유료 프로모션 포함' 표시"]
  blog:
    allowed: true
    requires: ["상단 광고 표시(자동)", "병원 링크 rel=sponsored(자동)"]
  x:
    allowed: false
    why: "X 의 의료·미용 광고 정책 확인 전 — 확인 후 allowed: true 와 requires 로 바꾼다 (pipeline/social.py)"
  threads:
    allowed: false
    why: "Meta 브랜디드 콘텐츠 정책(Threads) 확인 전 — 확인 후 allowed: true 와 requires 로 바꾼다"
# SNS 프로필 링크에는 스폰서 병원 링크를 걸지 않는다 (대가 관계 링크 = 브랜디드 콘텐츠로 볼 여지). 프로필 → 우리 블로그 → 스폰서 글 → 병원.

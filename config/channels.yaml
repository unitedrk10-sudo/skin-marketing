# 채널별 포맷·빈도 (기획서 2장). 01_topics / 02_draft 프롬프트에 그대로 들어간다.

audience:
  language: en            # 영어권 우선
  regions: [US, CA, TH, SG]

shortform:
  duration_sec: [30, 60]
  hook_sec: 3             # 첫 2~3초 질문형 훅
  channels:
    tiktok:    {per_week: 5, aspect: "9:16", notes: "빠른 컷, 트렌드 사운드 금지(라이선스)"}
    instagram: {per_week: 4, aspect: "9:16", notes: "방한 전 탐색층, 저장 유도"}
    youtube:   {per_week: 4, aspect: "9:16", notes: "검색 키워드를 제목 앞쪽에"}

blog:
  per_week: 2
  words: [1200, 2000]

content_axes:             # 기획서 3장
  - procedure            # 시술 설명
  - price_guide          # 가격 가이드 (특정 병원 가격표 X)
  - how_to               # 이용 가이드
  - trend                # 트렌드
  - review_curation      # 후기 큐레이션 (병원별 X)
  - procedure_travel     # 시술 × 여행 (정보만)
  - travel_guide         # 관광지 소개·코스 (AI 검색 유입 통로, config/attractions.yaml, 시술 후 주의점 포함)
  - skincare             # 재생·진정 화장품·홈케어 (화장품법 §13: 의약품 오인 표현 금지, 협찬이면 스폰서 트랙)

topics_per_week: 6

# 스폰서(병원 광고) 콘텐츠를 올릴 수 있는 채널 — 플랫폼 정책 (2026-09 확인, 기획서 12-1-1)
# 06_publish 는 allowed: false 채널에 스폰서 콘텐츠를 올리지 않고, requires 설정을 켠 채로만 게시한다.
sponsored_policy:
  tiktok:
    allowed: false
    why: "TikTok Branded Content Policy — 미용 클리닉·미용 시술 홍보 금지 (2026-03 완화는 미국·캐나다 병원의 유료 광고만 해당)"
  instagram:
    allowed: true
    requires: ["브랜디드 콘텐츠 도구(유료 파트너십 라벨)로 병원 태그", "18세 이상 연령 제한"]
  youtube:
    allowed: true
    requires: ["'유료 프로모션 포함' 표시"]
  blog:
    allowed: true
    requires: ["상단 광고 표시(자동)", "병원 링크 rel=sponsored(자동)"]
# SNS 프로필 링크에는 스폰서 병원 링크를 걸지 않는다 (대가 관계 링크 = 브랜디드 콘텐츠로 볼 여지). 프로필 → 우리 블로그 → 스폰서 글 → 병원.

# 시술·주제 분류 + 수요 사전값 — pipeline.analytics(시술별 집계), pipeline.demand(주제 추천 점수)가 쓴다.
# keywords: 소문자, 단어 단위로 찾는다 (글 제목·키워드·slug). 한 글이 여러 시술에 걸리면 모두에 센다. 안 걸리면 "other".
# demand: 우리 트래픽 데이터가 쌓이기 전에 쓰는 영어권(미국·캐나다 중심) 관심도 사전값 1~5.
#   데이터가 쌓이면 pipeline.demand 가 실제 조회수·클릭 비중을 점점 더 크게 반영한다 (사전값 비중 최소 30% 유지).
# 근거 (2026-09-28 조사):
#   - 2025 외국인 환자 201만 명 중 피부과 62.9%, 미국인 17.3만 명(+70.4%) — 보건복지부·KHIDI 발표 (Korea Times 2026-04-24)
#   - 미국·홍콩 환자는 써마지(리프팅) 선호 — 같은 발표 보도
#   - 미국에서 "salmon sperm facial"(PDRN·리쥬란) 검색 관심 급증, 리쥬란 주사는 미국 FDA 미승인 → 한국 방문 수요 (Bloomberg 2025-09-11, NBC 2025)
#   - 외국인 인기 시술: 아쿠아필·하이드라페이셜, 스킨부스터(리쥬란·쥬베룩), 리프팅(슈링크·인모드·써마지), 보톡스·필러 (Creatrip 2026)
#   - 서양 방문객 후기에 자주 나오는 것: 리쥬란·써마지·엑셀V(홍조·혈관) (AOL/Travel+Leisure 2026)


# AI 인용 점검 질문 (pipeline/citation_check.py) — 해외 독자가 AI 에 물을 법한 질문. 추이 비교를 위해 되도록 바꾸지 말고 추가만.
# 우리가 쓴 주제 위주 + 쓸 예정인 주제. 병원 추천 질문("best clinic")은 넣지 않는다 (우리는 병원을 고르지 않는다).

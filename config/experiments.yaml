# 숏폼 화면 소스 실험 (2026-10-19 결정, pipeline/experiment.py) — 같은 대본·음성·자막에 화면 소스만 바꿔 비교.
#   A = 무료 영상 자동 (Pixabay + Pexels, Claude 가 고름) — 기준선. 2026-10-19 결과 0점(전 항목) → 중단(획기적 방식 전까지)
#   B = Google Flow 직접 생성 (시스템이 장면 프롬프트를 보내면 사람이 Flow 에서 Veo 3.1 Lite 로 만들어 clips 폴더에 넣음)
#   C = Google Flow + Aside 루틴 (B 와 같은 프롬프트, Flow 전용 구글 계정·별도 프로필에서 Aside 가 생성 — 사람이 직접 운영)
# D(API)·E(디자인형)는 A~C 결과를 보고 결정. 숏폼 게시는 하지 않는다 (shortform.format: off 그대로) — 만들어 비교만.
send_hour: 10        # 한국 시간 — 이 시각 이후 첫 워커 실행에 그날 실험 안내 (SNS 9시와 겹치지 않게)
scenes: 5            # Flow 무료 하루 50크레딧 = Lite(10) 5개
style: >-
  Cinematic vertical 9:16 video, soft natural daylight, calm muted ivory and warm taupe palette, gentle film grain,
  shallow depth of field, slow steady camera, no people's faces, no text, no logos
schedule:   # 2026-10-19 변경: 2주 → 오늘 하루에 몰아서 (Flow 무료 50크레딧 = Lite 5개 = 계정당 하루 B 또는 C 한 번)
  - {date: 2026-10-19, method: B, post: W41-10}   # 리쥬란 — Flow 직접 (지금 계정 50크레딧)
  - {date: 2026-10-19, method: C, post: W43-03}   # 쥬베룩 — Flow 전용 계정 + Aside (그 계정 50크레딧)
  # A 는 영상 고르기·내려받기에 시간이 걸려 B·C 프롬프트를 먼저 보낸 뒤 만든다
  - {date: 2026-10-19, method: A, post: W41-10}   # 리쥬란 — 무료 영상 자동, 바로 완성
  - {date: 2026-10-19, method: A, post: W43-03}   # 쥬베룩 — 주제가 바뀌어도 되는지
  # 결과 보고 바로 결정 (D·E 시험 여부, 숏폼 재개 여부). 모자라면 내일 같은 방식으로 한 번 더
  # 2026-10-20 B1 점수 4·1·4·2 — 화면 일관성은 좋고 내용 일치가 약함 → 줄마다 한 장면(10개), 내용 일치 규칙 강화
  #   크레딧: Lite 10개 = 계정 2개 × 50 (지금 계정 5개 직접 + Flow 전용 계정 5개 = C 테스트를 겸함)
  - {date: 2026-10-20, method: B, post: W41-10, scenes: 10}

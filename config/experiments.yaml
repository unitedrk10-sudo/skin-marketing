# 숏폼 화면 소스 실험 (2026-10-19 결정, pipeline/experiment.py) — 같은 대본·음성·자막에 화면 소스만 바꿔 비교.
#   A = 무료 영상 자동 (Pixabay + Pexels, Claude 가 고름) — 기준선. 2026-10-19 결과 0점(전 항목) → 중단(획기적 방식 전까지)
#   B = Google Flow 직접 생성 (시스템이 장면 프롬프트를 보내면 사람이 Flow 에서 Veo 3.1 Lite 로 만들어 clips 폴더에 넣음)
#   C = Google Flow + Aside 루틴 (B 와 같은 프롬프트, Flow 전용 구글 계정·별도 프로필에서 Aside 가 생성 — 사람이 직접 운영)
# D(API)·E(디자인형)는 A~C 결과를 보고 결정. 숏폼 게시는 하지 않는다 (shortform.format: off 그대로) — 만들어 비교만.
send_hour: 10        # 한국 시간 — 이 시각 이후 첫 워커 실행에 그날 실험 안내 (SNS 9시와 겹치지 않게)
scenes: 5            # Flow 무료 하루 50크레딧 = Lite(10) 5개
style: >-
  Cinematic vertical 9:16 video, soft natural daylight, calm muted ivory and warm taupe palette, gentle film grain,
  shallow depth of field, slow steady camera, no people's faces, no text, no logos
looks:   # 2026-10-22 — 장면 프롬프트 화풍. 실험 항목에 look: <이름> (없으면 위 style)
  flatmotion:   # 섞기(M) 기본 — 우리 도식(E)과 같은 느낌의 2D 모션그래픽
    style: >-
      Flat 2D motion graphics animation, vertical 9:16, warm cream background (#F4EFE6), deep green (#1F3B2D), warm terracotta
      (#C8875E) and soft skin-tone shapes, clean vector look with smooth eased motion, subtle soft shadows, no gradients overload,
      no people, no faces, no text, no letters, no numbers, no logos
    guide: >-
      Every scene is a simple flat vector animation in the same palette, like an animated infographic without words: a side
      cross-section of skin as flat horizontal bands (light top layer, deeper middle layer, pale bottom layer), small round
      particles drifting into a band, wavy fibres drawing themselves, a soft pink blob shrinking and fading, simple flat icons for
      travel (suitcase, bed, plane, palace roof). Shapes move continuously for the whole clip (draw-on, drift, pulse, morph), with
      the camera still. Never write any words or numbers; never draw faces, needles or a before/after.
  explainer3d:
    style: >-
      Clean 3D medical explainer animation, vertical 9:16, soft studio lighting, calm ivory background with deep green and warm
      terracotta accents, smooth slow camera, semi-realistic stylized tissue (not gory, no blood), no people, no faces, no text,
      no labels, no logos
    guide: >-
      Show HOW things work as a 3D explainer animation: a cross-section of skin layers (epidermis, dermis, fat) seen from the side,
      small particles or molecules moving into a layer, fibers forming, a soft pink inflammation glow slowly calming. Abstract and
      schematic, never a real patient's face or body, never a needle or injection, never a before/after or a "perfect skin" result.
      Travel or planning lines may use simple stylized 3D objects (suitcase, calendar block, bed) in the same clay-like 3D style.
      Keep the SAME 3D style, palette and lighting in every scene so the video looks like one animation.


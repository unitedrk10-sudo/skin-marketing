# 블로그 사이트 설정 — pipeline/site.py
# 브랜드 Skinbound, 도메인 skinboundkorea.com (2026-09-28). 도메인이 바뀌면 domain 만 고치고 다시 빌드·배포.

name: Skinbound
domain: skinboundkorea.com      # 2026-09-28 결정 (skinbound.com 은 도메인 판매업체 보유). 비우면 sitemap·canonical 이 빠진다
tagline: Source-backed guides to dermatology procedures in Korea
description: >-
  Plain-English guides to Korean dermatology procedures for international visitors —
  how they work, downtime, typical price ranges and trip planning, with a source for every fact.
language: en
byline: Skinbound Editorial Team  # 사람 의사·전문의 명의 금지 (자격 오인)
contact_email: hello@skinboundkorea.com  # 2026-10-10 Cloudflare Email Routing (받기 전용 → 개인 메일로 전달). 소개·개인정보 페이지에 표시
cloudflare_project: skin-site     # Cloudflare Pages 프로젝트명 (wrangler pages deploy)
posts_on_home: 30
publish_schedule:               # 블로그 게시 요일 (2026-10-10 결정: 월·수·금, 하루 1편). 승인된 글은 다음 빈 요일에 배정
  days: [mon, wed, fri]         # 배정은 content/site/schedule.json 에 고정 — 확인: python -m pipeline.site schedule
  hour: 7                       # 한국 시간. 매시 배포 크론이 이 시각 이후 첫 실행에 올린다 → SNS 오늘의 글(9시) 전에 게시
clinic_directory:               # 여행 글 코스 주변 피부과 목록 (pipeline/clinics.py) — 기준을 바꾸면 모든 글에 똑같이 적용
  radius_m: 700                 # 관광지 중심 반경 — 이 안의 피부과 진료 의료기관 전부
  max_per_stop: 40              # 관광지당 표시 수 (넘으면 가까운 순으로 자르고 'N곳 중 가까운 M곳' 표시)
  refresh_days: 30
route_ads:                      # 중립 여행 글의 코스 광고 카드 (sponsors.yaml route_ad) — 작게·본문 뒤·표시는 분명히
  enabled: true
  hide_in_countries: [KR]       # 해외 대상 광고: 이 나라 방문자에게는 숨김 (의료법 §56②12 국내광고 시비 차단)
palette: charcoal               # 색 체계: green(짙은 녹색·세이지) | charcoal(차콜·토프). 포인트 버건디는 공통 — 바꾸면 아이콘·카드도 같이
partners_page: false          # 병원(광고주) 대상 한국어 안내 /partners/ — 변호사 확인(기획서 12-1-1) 후 true. 검색 제외·꼬리말 링크만
analytics_site_tag: "2768617998d947b0925482151b70c5c1"         # Web Analytics 사이트 태그(site tag) — 주제 추천이 글별 조회수를 읽을 때 사용 (.env CF_API_TOKEN, CF_ACCOUNT_ID)
analytics_token: "83139615d6714be495fb5d4bbf4d4b8a"             # Cloudflare Web Analytics 토큰 (대시보드 → Web Analytics → 사이트 추가) — 방문·AI 유입 집계
